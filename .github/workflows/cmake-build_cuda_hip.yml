name: CMake CUDA/HIP compile matrix

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_hip: ${{ steps.detect.outputs.has_hip }}
      has_cuda_backend: ${{ steps.detect.outputs.has_cuda_backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_hip=false
          has_cuda_backend=false

          if grep -R -n -E 'DEME_GPU_BACKEND|USE_HIP|LANGUAGES[[:space:]]+.*HIP|CMAKE_HIP_ARCHITECTURES|find_package\(.*HIP|project\(.*HIP|hipcc|ROCM_PATH|DEME_ROCM_ROOT|DEME_HIP_ARCH' CMakeLists.txt cmake src >/dev/null 2>&1; then
            has_hip=true
          fi

          if grep -R -n -E 'LANGUAGES[[:space:]]+.*CUDA|enable_language\(CUDA\)|find_package\(CUDAToolkit|CMAKE_CUDA_ARCHITECTURES|CUDA_ARCHITECTURES|nvcc|find_package\(.*CUB|jitify' CMakeLists.txt cmake src .gitmodules >/dev/null 2>&1; then
            has_cuda_backend=true
          fi

          echo "has_hip=$has_hip" >> "$GITHUB_OUTPUT"
          echo "has_cuda_backend=$has_cuda_backend" >> "$GITHUB_OUTPUT"

  cuda-build:
    name: CUDA ${{ matrix.cuda }}
    needs: detect
    if: needs.detect.outputs.has_cuda_backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - cuda: '12.8.1'
            image: 'nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04'
          - cuda: '13.2.0'
            image: 'nvidia/cuda:13.2.0-cudnn-devel-ubuntu24.04'
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            ninja-build \
            pkg-config

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          nvcc --version
          cmake --version
          test -f /usr/local/cuda/lib64/cmake/cub/cub-config.cmake
          test -f /usr/local/cuda/lib64/cmake/libcudacxx/libcudacxx-config.cmake
          test -f /usr/local/cuda/lib64/cmake/thrust/thrust-config.cmake
          test -f thirdparty/jitify/jitify.hpp

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DDEME_GPU_BACKEND=CUDA \
            -DCUDAToolkit_ROOT=/usr/local/cuda \
            -DCMAKE_PREFIX_PATH="/usr/local/cuda;/usr/local/cuda/lib64/cmake;/usr/local/cuda/targets/x86_64-linux" \
            -DCUB_DIR=/usr/local/cuda/lib64/cmake/cub \
            -Dlibcudacxx_DIR=/usr/local/cuda/lib64/cmake/libcudacxx \
            -DThrust_DIR=/usr/local/cuda/lib64/cmake/thrust

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel

  hip-build:
    name: ROCm ${{ matrix.rocm }} / all AMD targets
    needs: detect
    if: needs.detect.outputs.has_hip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - rocm: '7.2'
            image: 'rocm/dev-ubuntu-24.04:7.2-complete'
          - rocm: '7.2.1'
            image: 'rocm/dev-ubuntu-24.04:7.2.1-complete'

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Free disk space before pulling ROCm image
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Pull ROCm image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${{ matrix.image }}"

      - name: Build all AMD targets inside ROCm container
        shell: bash
        env:
          ROCM_VERSION: ${{ matrix.rocm }}
          ROCM_IMAGE: ${{ matrix.image }}
          ROCM_ARCHES: "gfx90a gfx942 gfx1100 gfx1101 gfx1102 gfx1151"
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            -e BUILD_TYPE="${BUILD_TYPE}" \
            -e ROCM_VERSION="${ROCM_VERSION}" \
            -e ROCM_ARCHES="${ROCM_ARCHES}" \
            "${ROCM_IMAGE}" \
            bash -lc '
              set -euo pipefail

              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                git \
                ninja-build \
                pkg-config

              /opt/rocm/bin/hipcc --version || hipcc --version
              cmake --version
              test -f /opt/rocm/include/hip/hip_runtime.h
              test -f /opt/rocm/include/hipcub/hipcub.hpp
              test -f thirdparty/jitify/jitify.hpp

              failures=()

              for arch in ${ROCM_ARCHES}; do
                echo "=== ROCm ${ROCM_VERSION} / ${arch} ==="
                build_dir="build-rocm-${ROCM_VERSION//./_}-${arch}"
                rm -rf "${build_dir}"

                if ! cmake -S . -B "${build_dir}" \
                  -G Ninja \
                  -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
                  -DDEME_GPU_BACKEND=HIP \
                  -DDEME_ROCM_ROOT=/opt/rocm \
                  -DROCM_PATH=/opt/rocm \
                  -DDEME_HIP_ARCH="${arch}" \
                  -DCMAKE_HIP_COMPILER_ROCM_ROOT=/opt/rocm \
                  -DCMAKE_HIP_PLATFORM=amd; then
                  failures+=("${arch}:configure")
                  continue
                fi

                if ! cmake --build "${build_dir}" --parallel; then
                  failures+=("${arch}:build")
                  continue
                fi
              done

              if [ "${#failures[@]}" -ne 0 ]; then
                printf "Failed AMD targets:\n"
                printf " - %s\n" "${failures[@]}"
                exit 1
              fi
            '
